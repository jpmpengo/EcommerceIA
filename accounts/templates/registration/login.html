{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="mb-4">Connexion</h1>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Se connecter
                </button>
            </form>

            <p class="mt-3">
                Pas encore de compte ?
                <a href="{% url 'accounts:register' %}">
                    Créer un compte
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
