{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4">Validation de la commande</h1>

    <div class="row">
        <div class="col-lg-7">
            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Confirmer la commande
                </button>
            </form>
        </div>

        <div class="col-lg-5">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5">Résumé du panier</h2>

                    {% for item in cart %}
                        <div class="d-flex justify-content-between mb-2">
                            <span>
                                {{ item.product.name }}
                                × {{ item.quantity }}
                            </span>

                            <span>
                                {{ item.total_price }} €
                            </span>
                        </div>
                    {% endfor %}

                    <hr>

                    <div class="d-flex justify-content-between fw-bold">
                        <span>Total</span>
                        <span>{{ cart.get_total_price }} €</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
